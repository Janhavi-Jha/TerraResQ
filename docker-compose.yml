services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: terraresq
      POSTGRES_PASSWORD: terraresq_password
      POSTGRES_DB: terraresq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraresq"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://terraresq:terraresq_password@postgres:5432/terraresq
      - DEMO_MODE=True
      - GPU_ENABLED=False
      - DEVICE=cpu
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data: